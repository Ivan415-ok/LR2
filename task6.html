<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 6</title>
</head>
<body>

<script>
    let number = Number(prompt("Введіть число:"));

    if (number % 2 === 0) {
        alert("Number is even");
    } else {
        alert("Number is odd");
    }
</script>

</body>
</html>
