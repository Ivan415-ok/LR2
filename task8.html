<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 8</title>
</head>
<body>

<script>
    const secretNumber = 2 % 10;

    let number = Number(prompt("Введіть число від 0 до 9:"));

    if (number === secretNumber) {
        alert("Correct!");
    } else {
        alert("Wrong!");
    }
</script>
